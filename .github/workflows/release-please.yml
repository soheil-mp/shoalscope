name: Release Please

# Maintains a release pull request from Conventional Commits on main. Merging that pull
# request tags vX.Y.Z, publishes a GitHub release and updates CHANGELOG.md and versions.
# The first release is v0.1.0, at the end of the walking skeleton (M1.11).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
