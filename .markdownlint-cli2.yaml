config:
  default: true
  MD013: false          # line length: prose is wrapped by editors, tables cannot wrap
  MD024:
    siblings_only: true # repeated headings are fine in different sections
  MD033: false          # inline HTML (<details>, <kbd>) is allowed
  MD041: false          # first line need not be a top-level heading (front matter)
  MD046: false          # admonitions (!!! note) need indented bodies, which look like code blocks
  MD060: false          # table column alignment is not enforced
ignores:
  - "**/node_modules/**"
  - "**/.venv/**"
  - "CHANGELOG.md"
