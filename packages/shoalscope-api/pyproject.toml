[project]
name = "shoalscope-api"
version = "0.1.0"
description = "Read API, OGC API - EDR, Zarr over HTTP and standard exports."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = ["shoalscope-core", "shoalscope-lake"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
shoalscope-core = { workspace = true }
shoalscope-lake = { workspace = true }
