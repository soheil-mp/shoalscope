[project]
name = "shoalscope-ingest"
version = "0.1.0"
description = "Source connectors, duty-cycled window sampling, data budgets and the source registry."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = ["shoalscope-core", "shoalscope-raw"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
shoalscope-core = { workspace = true }
shoalscope-raw = { workspace = true }
