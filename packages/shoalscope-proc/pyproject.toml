[project]
name = "shoalscope-proc"
version = "0.0.0"
description = "Acoustic processing L1 to L4: calibration, cleaning, targets, tracks, echo integration."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Soheil Mohammadpour" }]
dependencies = [
    "echopype>=0.12",
    "icechunk>=2.3",
    "shoalscope-core",
    "shoalscope-raw",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
shoalscope-core = { workspace = true }
shoalscope-raw = { workspace = true }
