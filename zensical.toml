[project]
site_name = "Shoalscope"
site_description = "Fish monitoring with scientific echosounders: physics-based detection, tracking and counting on a small-data lakehouse platform."
site_author = "Soheil Mohammadpour"
site_url = "https://soheil-mp.github.io/shoalscope/"
copyright = "Copyright &copy; 2026 Soheil Mohammadpour. MIT licence."
repo_url = "https://github.com/soheil-mp/shoalscope"
repo_name = "soheil-mp/shoalscope"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "Set up a development environment" = "tutorials/development-setup.md" },
    { "Read one ping from a 500 MB file" = "tutorials/read-a-remote-ping.md" },
  ] },
  { "How-to guides" = [
    { "Add a dependency" = "how-to/add-a-dependency.md" },
    { "Sync the roadmap to issues" = "how-to/sync-roadmap-issues.md" },
    { "Apply the repository settings" = "how-to/apply-repository-settings.md" },
  ] },
  { "Reference" = [
    { "Commands" = "reference/commands.md" },
    { "Environment variables" = "reference/environment.md" },
  ] },
  { "Explanation" = [
    { "Architecture" = "architecture.md" },
    { "Research: fisheries acoustics" = "research/01-fisheries-acoustics.md" },
    { "Research: data sources" = "research/02-data-sources.md" },
    { "Research: technology" = "research/03-technology-landscape.md" },
    { "Decision records" = [
      { "Overview" = "adr/README.md" },
      { "0001 Record decisions" = "adr/0001-record-architecture-decisions.md" },
      { "0002 Rule-based processing" = "adr/0002-deterministic-rule-based-processing.md" },
      { "0003 Echolevels layers" = "adr/0003-echolevels-as-storage-layers.md" },
      { "0004 Small data by design" = "adr/0004-small-data-by-design.md" },
      { "0005 Build on echopype" = "adr/0005-build-on-echopype.md" },
      { "0006 Arrays in Icechunk" = "adr/0006-arrays-in-icechunk.md" },
      { "0007 Tables in Iceberg" = "adr/0007-tables-in-iceberg.md" },
      { "0008 Edge and NATS transport" = "adr/0008-edge-transport-nats.md" },
      { "0009 Dagster orchestration" = "adr/0009-orchestration-dagster.md" },
      { "0010 dbt transformations" = "adr/0010-transformations-dbt.md" },
      { "0011 Schemas and contracts" = "adr/0011-schemas-and-data-contracts.md" },
      { "0012 Simulator as ground truth" = "adr/0012-simulator-as-ground-truth.md" },
      { "0013 Privacy and attribution" = "adr/0013-privacy-allowlist-and-attribution.md" },
      { "0014 Python toolchain" = "adr/0014-python-toolchain-monorepo.md" },
    ] },
  ] },
  { "Roadmap" = "https://github.com/soheil-mp/shoalscope/blob/main/ROADMAP.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/soheil-mp/shoalscope"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
